<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CAP — Ciberseguridad para pequeñas y medianas empresas en Chile. Diagnóstico, protección, monitoreo y vCISO sin el costo de un equipo interno.">
<title>CAP — Ciberseguridad para PYMEs en Chile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071016; --bg2:#0b151c; --surface:#101d25; --surface2:#13232c;
  --ink:#f3f7f8; --muted:#9aabb4; --line:rgba(255,255,255,.10);
  --accent:#5eead4; --accent2:#22d3ee; --accent-dark:#07332f;
  --danger:#fb7185; --warn:#fbbf24; --ok:#5eead4;
  --radius:18px; --max:1180px;
  --head:'Space Grotesk',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit} .wrap{width:min(var(--max),calc(100% - 48px));margin:auto}
section{padding:100px 0;border-top:1px solid var(--line)}
header{position:sticky;top:0;z-index:50;background:rgba(7,16,22,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.header-row{height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font:700 1.45rem var(--head);letter-spacing:-.04em}.logo i{font-style:normal;color:var(--accent)}
nav{display:flex;align-items:center;gap:28px;font-size:.92rem;color:var(--muted)} nav a{text-decoration:none}nav a:hover{color:var(--ink)}
.nav-cta{padding:10px 16px;border:1px solid rgba(94,234,212,.35);background:rgba(94,234,212,.08);color:var(--accent);border-radius:10px;font-weight:700}
.hero{padding:84px 0 92px;position:relative;overflow:hidden;border-top:0}
.hero:before{content:"";position:absolute;inset:-25% -10% auto auto;width:600px;height:600px;background:radial-gradient(circle,rgba(34,211,238,.13),transparent 65%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:72px;align-items:center;position:relative}
.eyebrow{display:inline-flex;gap:9px;align-items:center;color:var(--accent);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px rgba(94,234,212,.65)}
h1{font:600 clamp(3rem,6vw,5.25rem)/.98 var(--head);letter-spacing:-.055em;margin:0;max-width:10.5ch}
.lede{font-size:1.15rem;color:var(--muted);max-width:58ch;margin:26px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:13px;margin-top:32px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:11px;text-decoration:none;font-weight:700;border:1px solid transparent}.btn-primary{background:var(--accent);color:#06201d}.btn-secondary{border-color:var(--line);background:rgba(255,255,255,.035);color:var(--ink)}.btn-secondary:hover{background:rgba(255,255,255,.07)}
.microproof{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:.85rem;color:#7f929d}.microproof span{display:inline-flex;align-items:center;gap:7px}.tick{color:var(--accent)}
.hero-card{background:linear-gradient(145deg,rgba(19,35,44,.92),rgba(10,22,28,.96));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.card-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;margin-bottom:8px;border-bottom:1px solid var(--line)}.label{font-size:.76rem;color:#7f929d;text-transform:uppercase;letter-spacing:.1em}.live{font-size:.75rem;color:var(--accent);display:flex;gap:7px;align-items:center}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.score{display:flex;align-items:flex-end;gap:12px;margin:22px 0 18px}.score strong{font:600 3.5rem/.9 var(--head);letter-spacing:-.07em}.score span{color:var(--muted);font-size:.86rem;padding-bottom:3px}
.bar{height:8px;background:#1b2a33;border-radius:999px;overflow:hidden}.bar span{display:block;width:72%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit}
.audit{margin-top:18px;display:grid;gap:2px}.audit-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:.88rem}.audit-row:last-child{border-bottom:0}.audit-row em{font-style:normal;padding:4px 9px;border-radius:999px;font-size:.72rem;font-weight:700}.high{background:rgba(251,113,133,.11);color:#fda4af}.med{background:rgba(251,191,36,.10);color:#fcd34d}.ok{background:rgba(94,234,212,.10);color:var(--accent)}
.trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;color:#78909c}.trust-row{display:flex;align-items:center;justify-content:space-between;gap:25px;flex-wrap:wrap}.trust-kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}.techs{display:flex;gap:12px;flex-wrap:wrap}.tech{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:.77rem;background:rgba(255,255,255,.025)}
.section-head{max-width:720px}.section-head h2{font:600 clamp(2rem,4vw,3.25rem)/1.05 var(--head);letter-spacing:-.045em;margin:0}.section-head p{color:var(--muted);font-size:1.05rem;margin:16px 0 0}
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:46px}.svc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-height:260px}.svc .num{color:var(--accent);font:600 1rem var(--head)}.svc h3{font:600 1.35rem var(--head);margin:28px 0 9px}.svc p{color:var(--muted);font-size:.92rem}.svc a{display:inline-flex;margin-top:18px;color:var(--accent);font-size:.86rem;font-weight:700;text-decoration:none}
.problem{background:linear-gradient(180deg,var(--bg2),var(--bg));}.problem-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:70px;align-items:start}.problem-list{display:grid;gap:0;margin-top:4px}.problem-item{padding:22px 0;border-top:1px solid var(--line)}.problem-item:last-child{border-bottom:1px solid var(--line)}.problem-item h3{font:600 1.1rem var(--head);margin:0 0 5px}.problem-item p{color:var(--muted);margin:0;font-size:.93rem}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:46px;align-items:stretch}.plan{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column}.plan.featured{border-color:rgba(94,234,212,.45);box-shadow:0 0 0 1px rgba(94,234,212,.08),0 28px 70px rgba(0,0,0,.20)}.tag{align-self:flex-start;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:#06201d;background:var(--accent);border-radius:999px;padding:5px 9px;margin-bottom:15px}.plan h3{font:600 1.45rem var(--head);margin:0}.price{font:600 1.8rem var(--head);margin:13px 0 4px;letter-spacing:-.03em}.price small{font:400 .78rem var(--body);color:var(--muted)}.plan .desc{color:var(--muted);font-size:.9rem;min-height:68px}.features{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px;color:#c7d2d8;font-size:.87rem}.features li{position:relative;padding-left:19px}.features li:before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700}.plan .btn{margin-top:24px}.pricing-note{margin-top:18px;color:#7f929d;font-size:.8rem;max-width:78ch}
.process{background:var(--surface)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:48px}.step{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:16px;padding:22px}.step .n{color:var(--accent);font:600 1.3rem var(--head)}.step h3{font:600 1.05rem var(--head);margin:20px 0 7px}.step p{color:var(--muted);font-size:.86rem;margin:0}
.deliverables{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:42px}.deliver{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:24px}.deliver h3{font:600 1.1rem var(--head);margin:0 0 14px}.deliver p{color:var(--muted);font-size:.9rem;margin:0}.deliver ul{color:#c7d2d8;padding-left:18px;font-size:.86rem;line-height:1.8}
.reg{display:grid;grid-template-columns:.8fr 1.2fr;gap:55px;align-items:start}.reg-card{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:26px}.reg-card div{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}.reg-card div:last-child{border-bottom:0}.badge{color:var(--accent);font-weight:700}.reg-card p{margin:0;color:var(--muted);font-size:.9rem}.legal-note{font-size:.76rem;color:#6f828d;margin-top:13px}
.cta{background:linear-gradient(135deg,#0b302c 0%,#092127 52%,#071016 100%)}.cta-grid{display:grid;grid-template-columns:1fr .9fr;gap:60px;align-items:start}.cta h2{font:600 clamp(2.3rem,5vw,4rem)/1 var(--head);letter-spacing:-.055em;margin:0;max-width:10ch}.cta p{color:#a9c0c7;max-width:55ch}.form{margin-top:28px;display:grid;gap:12px}.form input,.form textarea,.form select{width:100%;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.18);color:var(--ink);border-radius:10px;padding:12px 13px;font:inherit;font-size:.9rem}.form textarea{resize:vertical}.form button{border:0;cursor:pointer;font:700 .92rem var(--body);padding:13px 18px;border-radius:10px;background:var(--accent);color:#06201d;justify-self:start}.direct{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:24px;background:rgba(0,0,0,.12)}.direct .mini{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:#77939c}.direct a{display:block;margin-top:7px;color:var(--accent);font-weight:700;text-decoration:none}.direct + .direct{margin-top:12px}
footer{padding:32px 0;color:#70848d;font-size:.8rem}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
@media(max-width:940px){.hero-grid,.problem-grid,.reg,.cta-grid{grid-template-columns:1fr}.hero-grid{gap:44px}.services-grid,.pricing-grid{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr}h1{max-width:12ch}.deliverables{grid-template-columns:1fr}}
@media(max-width:640px){.wrap{width:min(var(--max),calc(100% - 30px))}section{padding:72px 0}.header-row{height:68px}nav a:not(.nav-cta){display:none}.hero{padding:62px 0 72px}.services-grid,.pricing-grid,.steps{grid-template-columns:1fr}.trust-row{align-items:flex-start;flex-direction:column}.hero-card{padding:20px}.score strong{font-size:3rem}.plan .desc{min-height:0}}
</style>
</head>
<body>
<header>
  <div class="wrap header-row">
    <div class="logo">CAP<i>.</i></div>
    <nav>
      <a href="#servicios">Servicios</a>
      <a href="#planes">Planes</a>
      <a href="#metodo">Cómo trabajamos</a>
      <a class="nav-cta" href="#contacto">Hablar con un especialista</a>
    </nav>
  </div>
</header>

<main>
<section class="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow"><span class="dot"></span> Ciberseguridad para PYMEs en Chile</div>
      <h1>Tu empresa no necesita un CISO de tiempo completo. Necesita uno que responda.</h1>
      <p class="lede">Ayudamos a pequeñas y medianas empresas a identificar riesgos, proteger sus sistemas y responder ante incidentes, con seguridad de nivel empresarial aterrizada a su tamaño y presupuesto.</p>
      <div class="actions">
        <a class="btn btn-primary" href="#contacto">Solicitar diagnóstico inicial</a>
        <a class="btn btn-secondary" href="#planes">Ver planes desde</a>
      </div>
      <div class="microproof">
        <span><b class="tick">✓</b> Diagnóstico inicial sin costo</span>
        <span><b class="tick">✓</b> Planes mensuales</span>
        <span><b class="tick">✓</b> Enfoque en riesgo real</span>
      </div>
    </div>
    <div class="hero-card">
      <div class="card-top"><span class="label">Ejemplo de evaluación</span><span class="live">Postura de seguridad</span></div>
      <div class="score"><strong>72%</strong><span>nivel de control<br>identificado</span></div>
      <div class="bar"><span></span></div>
      <div class="audit">
        <div class="audit-row"><span>Identidad y MFA</span><em class="ok">Controlado</em></div>
        <div class="audit-row"><span>Exposición externa</span><em class="med">Revisar</em></div>
        <div class="audit-row"><span>Cuentas privilegiadas</span><em class="high">Prioridad alta</em></div>
        <div class="audit-row"><span>Backups y recuperación</span><em class="ok">Verificado</em></div>
      </div>
    </div>
  </div>
</section>

<div class="trust"><div class="wrap trust-row"><div class="trust-kicker">Tecnologías con las que podemos trabajar</div><div class="techs"><span class="tech">Microsoft 365</span><span class="tech">Defender</span><span class="tech">Entra ID</span><span class="tech">Fortinet</span><span class="tech">Palo Alto</span><span class="tech">SIEM</span><span class="tech">Open Source</span></div></div></div>

<section id="servicios">
  <div class="wrap">
    <div class="section-head"><h2>No vendemos herramientas. Resolvemos riesgos.</h2><p>La tecnología es el medio. Nuestro trabajo es ayudarte a saber qué puede salir mal, qué debes corregir primero y quién se hará cargo cuando ocurra.</p></div>
    <div class="services-grid">
      <article class="svc"><div class="num">01 / ASSESSMENT</div><h3>Cyber Check</h3><p>Evaluamos identidad, endpoints, red, correo, exposición a Internet, backups y controles críticos. Entregamos hallazgos priorizados y un roadmap.</p><a href="#contacto">Evaluar mi empresa →</a></article>
      <article class="svc"><div class="num">02 / PROTECTION</div><h3>Protección gestionada</h3><p>Implementamos y administramos las capas necesarias: MFA, EDR, firewall, hardening, políticas, vulnerabilidades y controles de seguridad.</p><a href="#planes">Ver planes →</a></article>
      <article class="svc"><div class="num">03 / DETECTION</div><h3>Monitoreo & respuesta</h3><p>Centralizamos alertas, definimos escalamiento y damos seguimiento a eventos para que un incidente no dependa de que alguien lo vea por casualidad.</p><a href="#contacto">Hablar sobre monitoreo →</a></article>
      <article class="svc"><div class="num">04 / RESILIENCE</div><h3>Ransomware Readiness</h3><p>Comprobamos si tu empresa puede resistir y recuperarse de un escenario de ransomware: accesos, segmentación, backups, RPO, RTO y respuesta.</p><a href="#contacto">Preparar mi empresa →</a></article>
      <article class="svc"><div class="num">05 / EXPOSURE</div><h3>Attack Surface</h3><p>Miramos tu organización desde Internet: dominios, subdominios, servicios expuestos, certificados, VPN, configuraciones y vulnerabilidades visibles.</p><a href="#contacto">Revisar exposición →</a></article>
      <article class="svc"><div class="num">06 / STRATEGY</div><h3>vCISO & cumplimiento</h3><p>Gobernanza, riesgos, políticas, roadmap y acompañamiento a gerencia. Coordinamos la parte técnica con asesoría legal cuando el proyecto lo requiere.</p><a href="#contacto">Conocer vCISO →</a></article>
    </div>
  </div>
</section>

<section class="problem">
  <div class="wrap problem-grid">
    <div class="section-head"><h2>Las preguntas que una pyme debería poder responder hoy.</h2><p>No hace falta tener un equipo de 20 personas. Hace falta tener las respuestas antes de que llegue el incidente.</p></div>
    <div class="problem-list">
      <div class="problem-item"><h3>¿Qué pasaría si roban la cuenta del gerente?</h3><p>Revisamos MFA, privilegios, acceso condicional, sesiones y controles de identidad para reducir el impacto de una cuenta comprometida.</p></div>
      <div class="problem-item"><h3>¿Podemos recuperar la empresa después de un ransomware?</h3><p>No basta con “tener backup”. Verificamos recuperación, dependencias, RPO/RTO y riesgo de que el atacante alcance los respaldos.</p></div>
      <div class="problem-item"><h3>¿Qué servicios tenemos expuestos a Internet?</h3><p>Construimos una vista externa de la superficie de ataque y priorizamos lo que requiere corrección.</p></div>
      <div class="problem-item"><h3>¿Quién responde cuando algo realmente pasa?</h3><p>Definimos contactos, escalamiento, tiempos y procedimientos para que el primer paso no sea improvisar.</p></div>
    </div>
  </div>
</section>

<section id="planes">
  <div class="wrap">
    <div class="section-head"><h2>Planes claros. Sin pagar por una plataforma que tu empresa todavía no necesita.</h2><p>Publicamos precios de entrada para que tengas una referencia. El valor final depende del número de usuarios/equipos, tecnologías y alcance.</p></div>
    <div class="pricing-grid">
      <article class="plan"><h3>Esencial</h3><div class="price">Desde $350.000 <small>/ mes</small></div><p class="desc">Para empresas que necesitan ordenar y mantener sus controles básicos de seguridad.</p><ul class="features"><li>Gestión y monitoreo de firewall</li><li>EDR administrado</li><li>Revisión de controles críticos</li><li>Reporte mensual ejecutivo</li><li>Soporte y recomendaciones</li></ul><a class="btn btn-secondary" href="#contacto">Cotizar Esencial</a></article>
      <article class="plan featured"><span class="tag">Más completo</span><h3>SOC Ligero</h3><div class="price">Desde $650.000 <small>/ mes</small></div><p class="desc">Para empresas que necesitan monitoreo activo y capacidad de reacción durante horario hábil.</p><ul class="features"><li>Todo lo incluido en Esencial</li><li>Monitoreo y alertamiento activo</li><li>Gestión de incidentes</li><li>Escalamiento definido</li><li>Horas de respuesta incluidas según alcance</li></ul><a class="btn btn-primary" href="#contacto">Cotizar SOC Ligero</a></article>
      <article class="plan"><h3>vCISO</h3><div class="price">Desde $900.000 <small>/ mes</small></div><p class="desc">Para empresas que necesitan dirección de seguridad, riesgo y cumplimiento sin contratar un equipo interno.</p><ul class="features"><li>Roadmap y matriz de riesgos</li><li>Políticas y procedimientos</li><li>Revisión periódica de controles</li><li>Reporte a gerencia</li><li>Acompañamiento técnico-estratégico</li></ul><a class="btn btn-secondary" href="#contacto">Cotizar vCISO</a></article>
    </div>
    <p class="pricing-note">Los precios publicados son referencias “desde” y no incluyen necesariamente licencias de terceros, implementaciones extraordinarias, proyectos ofensivos ni servicios fuera del alcance acordado.</p>
  </div>
</section>

<section id="metodo" class="process">
  <div class="wrap">
    <div class="section-head"><h2>Del problema al control.</h2><p>Un ciclo simple: descubrir, priorizar, corregir y mantener.</p></div>
    <div class="steps">
      <div class="step"><div class="n">01</div><h3>Descubrir</h3><p>Entendemos tu negocio, activos, accesos, exposición y controles actuales.</p></div>
      <div class="step"><div class="n">02</div><h3>Priorizar</h3><p>Convertimos hallazgos técnicos en riesgos de negocio y un plan de 30/60/90 días.</p></div>
      <div class="step"><div class="n">03</div><h3>Corregir</h3><p>Implementamos hardening, controles y herramientas donde realmente generan valor.</p></div>
      <div class="step"><div class="n">04</div><h3>Operar</h3><p>Monitoreamos, reportamos y mejoramos continuamente la postura de seguridad.</p></div>
    </div>
    <div class="deliverables">
      <div class="deliver"><h3>Lo que recibe gerencia</h3><p>Información para decidir, no un documento técnico que nadie lee.</p><ul><li>Resumen ejecutivo</li><li>Riesgos priorizados</li><li>Mapa de controles</li><li>Roadmap de remediación</li><li>Recomendación de inversión</li></ul></div>
      <div class="deliver"><h3>Lo que recibe TI</h3><p>Acciones concretas para implementar y demostrar avance.</p><ul><li>Hallazgos técnicos</li><li>Configuraciones a corregir</li><li>Responsables y prioridades</li><li>Evidencias y seguimiento</li><li>Retest cuando corresponda</li></ul></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap reg">
    <div class="section-head"><h2>Prepararse para el nuevo escenario regulatorio chileno.</h2><p>La seguridad y la protección de datos están tomando un peso mayor en las empresas. Nosotros abordamos la parte técnica y de gestión, coordinando la dimensión legal con especialistas cuando corresponde.</p></div>
    <div>
      <div class="reg-card">
        <div><span class="badge">21.663</span><p>Evaluación y fortalecimiento de controles de ciberseguridad según el alcance aplicable a la organización.</p></div>
        <div><span class="badge">21.719</span><p>Preparación técnica para proteger y gestionar datos personales, con entrada en vigencia el 1 de diciembre de 2026.</p></div>
        <div><span class="badge">NIST / CIS</span><p>Marcos de referencia que podemos utilizar para estructurar evaluaciones, controles y roadmaps.</p></div>
      </div>
      <p class="legal-note">La referencia normativa no constituye asesoría jurídica ni determina por sí sola si una empresa está sujeta a una obligación específica.</p>
    </div>
  </div>
</section>

<section class="cta" id="contacto">
  <div class="wrap cta-grid">
    <div>
      <div class="eyebrow">Primer paso</div>
      <h2>Conversemos sobre dónde está realmente tu riesgo.</h2>
      <p style="margin-top:20px">Cuéntanos tamaño de empresa, principales sistemas y qué te preocupa. El diagnóstico inicial sirve para decidir si vale la pena avanzar y por dónde partir.</p>
      <form class="form" action="mailto:hola@cap.cl" method="post" enctype="text/plain">
        <input type="text" name="nombre" placeholder="Nombre" required>
        <input type="text" name="empresa" placeholder="Empresa">
        <input type="email" name="email" placeholder="Correo corporativo" required>
        <select name="interes"><option value="">¿Qué necesitas?</option><option>Diagnóstico de ciberseguridad</option><option>Protección gestionada</option><option>Monitoreo / SOC</option><option>Ransomware Readiness</option><option>Attack Surface</option><option>vCISO / Cumplimiento</option></select>
        <textarea name="mensaje" rows="4" placeholder="Cuéntanos brevemente tu situación"></textarea>
        <button type="submit">Solicitar diagnóstico inicial</button>
      </form>
    </div>
